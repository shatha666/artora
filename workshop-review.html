<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Review | Artora Club</title>
    <link rel="stylesheet" href="style.css">
    <script src="member.js"></script>
</head>
<body class="member-page">
<div class="site-frame">

    <header class="site-header">
        <div class="brand">
            <img src="images/artora-logo.png" alt="Artora Club logo">
            <div class="brand-copy">
                <strong>Artora club</strong>
                <span>Create, learn, connect</span>
            </div>
        </div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="workshops.html">Workshops</a>
            <a href="about.html">About Us</a>
            <a href="member-dashboard.html">Member Dashboard</a>
            <a href="manager-dashboard.html">Manager Dashboard</a>
        </nav>
    </header>

    <main>
        <p class="breadcrumb"><a href="index.html">Home</a> &gt; <a href="member-dashboard.html">Member Dashboard</a> &gt; Workshop Review</p>

        <h1 class="page-title">Workshop Review</h1>

        <form class="member-box" action="#" method="post" onsubmit="return validateReview()">
            <h2>Completed workshop review form</h2>

            <div class="form-row">
                <label for="completed-workshop" id="workshop-label">Completed Workshop:</label>
                <select id="completed-workshop" name="completed-workshop">
                    <option value="">Select completed workshop</option>
                    <option value="painting">Painting workshop</option>
                </select>
            </div>

            <div class="form-row">
                <label for="rating" id="rating-label">Rating:</label>
                <select id="rating" name="rating" class="rating-select">
                    <option value="">Select rating</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
                <span>1-5</span>
            </div>

            <div class="form-row">
                <label for="feedback" id="feedback-label">Written feedback:</label>
                <textarea id="feedback" name="feedback" rows="4" placeholder="Enter feedback..."></textarea>
            </div>

            <input type="submit" class="submit-btn" value="Submit">
        </form>
    </main>

    <footer class="site-footer">
        Copyright 2026 Artora Club | Contact info@artoraclub.com
    </footer>

</div>
    <script src="theme.js"></script>
</body>
</html>
