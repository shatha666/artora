<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artora Club - Workshops</title>
    <link rel="stylesheet" href="style.css">
    <script src="workshops.js"></script>
</head>
<body>
<div class="site-frame">
    <header class="site-header">
        <div class="brand">
            <img src="images/artora-logo.png" alt="Artora Club Logo">
            <div class="brand-copy">
                <strong>Artora club</strong>
                <span>Create, learn, connect</span>
            </div>
        </div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="workshops.html">Workshops</a>
            <a href="about.html">About Us</a>
            <a href="member-dashboard.html">Member Dashboard</a>
            <a href="manager-dashboard.html">Manager Dashboard</a>
        </nav>
    </header>

    <main>
        <p class="breadcrumb"><a href="index.html">Home</a> &gt; Workshops</p>
        <h1 class="page-title">All club workshops</h1>

        <section class="workshop-controls">
            <div class="search-control">
                <label for="search">Search workshops</label>
                <input id="search" name="search" type="text" oninput="filterWorkshops()" placeholder="Search by title, instructor or keyword...">
            </div>
            <div class="filter-control">
                <label for="filter">Filter by price:</label>
                <select id="filter" name="filter" onchange="filterWorkshops()">
                    <option value="all">All</option>
                    <option value="free">Free</option>
                    <option value="paid">Paid</option>
                </select>
            </div>
            <div class="sort-control">
                <label for="sort">Sort by:</label>
                <select id="sort" name="sort" onchange="sortWorkshops()">
                    <option value="">Select</option>
                    <optgroup label="Price">
                        <option value="low-high">Low to High</option>
                        <option value="high-low">High to Low</option>
                    </optgroup>
                    <optgroup label="Name">
                        <option value="a-z">A-Z</option>
                        <option value="z-a">Z-A</option>
                    </optgroup>
                </select>
            </div>
        </section>

        <section class="workshop-grid" id="workshopGrid">
            <!-- the workshops are added here by workshops.js -->
        </section>

        <section class="home-section event-section">
            <h2>Upcoming art event</h2>
            <div class="event-bar">Upcoming exhibition | community sketch day | open studio session</div>
        </section>
    </main>

    <footer class="site-footer">Copyright 2026 Artora Club | Contact info@artoraclub.com</footer>
</div>
    <script src="theme.js"></script>
<script src="save-status.js"></script>

</body>
</html>
